# Renders every screen on the JVM (Robolectric, native graphics) and commits the pictures to docs/phase3/screens, so the screens can
# be reviewed without a phone and shown in reports. Run by hand after screen changes.
name: Screenshots

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screens:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Render the screens
        run: |
          set -o pipefail
          rm -rf docs/phase3/screens
          PFC_SCREENSHOTS="$GITHUB_WORKSPACE/docs/phase3/screens" ./gradlew --no-daemon :app:testDebugUnitTest --tests '*ScreenshotsTest*' 2>&1 | tee gradle-screens.log
          python3 -I tools/ci_summary.py "Screenshots=app/build/test-results/testDebugUnitTest/*.xml"
          ls -l docs/phase3/screens | tail -n +2 | wc -l | awk '{print "::notice title=Screens::" $1 " pictures"}'

      - name: Report errors
        if: failure()
        run: |
          python3 -I tools/ci_errors.py gradle-*.log
          python3 -I tools/ci_summary.py "Screenshots=app/build/test-results/testDebugUnitTest/*.xml" || true

      - name: Commit the pictures
        run: |
          git add -A docs/phase3/screens
          if git diff --cached --quiet; then
            echo "::notice title=Screens::unchanged"
          else
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Screen pictures (generated by the Screenshots workflow)"
            git push
            echo "::notice title=Screens::committed"
          fi
