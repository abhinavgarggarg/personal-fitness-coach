# Commits Room's exported schema JSON (Phase 2 data rule 1: every schema version is committed and used by migration tests).
# Run by hand after a database change; CI fails while data/schemas differs from what the build exports.
name: Room schema

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  schema:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Export the schema
        run: ./gradlew --no-daemon :data:kspDebugKotlin

      - name: Commit it when it changed
        run: |
          git add data/schemas
          if git diff --cached --quiet; then
            echo "::notice title=Room schema::already up to date"
          else
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Room schema export (generated by the Room schema workflow)"
            git push
            echo "::notice title=Room schema::committed $(git diff --stat HEAD~1 -- data/schemas | tail -n 1)"
          fi
