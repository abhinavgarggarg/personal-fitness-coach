# Device matrix (decision D-044): the app must work on any Android phone or tablet with Android 10+,
# not just the Product Owner's. Runs the device tests on emulators covering the oldest supported
# version, Android 12 (different exact-alarm rules), the newest versions, a small phone, a tablet
# and 200% font size. Emulators are slow, so this runs weekly, before releases and on demand —
# not on every push (keeps within GitHub's free monthly minutes for private repositories).
name: Devices

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 0" # Sundays 03:17 UTC
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Android 10, small phone", api: 29, profile: "Nexus 5", font: "1.0" }
          - { name: "Android 12, phone", api: 31, profile: "pixel_6", font: "1.0" }
          - { name: "Android 14, phone, 200% text", api: 34, profile: "pixel_6", font: "2.0" }
          - { name: "Android 16, phone", api: 36, profile: "pixel_7", font: "1.0" }
          - { name: "Android 16, tablet", api: 36, profile: "pixel_tablet", font: "1.0" }
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run device tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell settings put system font_scale ${{ matrix.font }}
            ./gradlew --no-daemon :app:connectedDebugAndroidTest

      - name: Upload device test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-tests-api${{ matrix.api }}-${{ strategy.job-index }}
          path: app/build/reports/androidTests/
          if-no-files-found: ignore
          retention-days: 30
