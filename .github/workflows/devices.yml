# Device matrix (decision D-044): the app must work on any Android phone or tablet with Android 10+,
# not just the Product Owner's. Runs the device tests on emulators covering the oldest supported
# version, Android 12 (different exact-alarm rules), the newest versions, a small phone, a tablet
# and 200% font size, plus a smoke test of the R8-shrunk release build (Part 8). Emulators are slow,
# so this runs weekly, before releases and on demand — not on every push (keeps within GitHub's free monthly minutes for private repositories).
name: Devices

on:
  workflow_dispatch:
    inputs:
      release_smoke_only:
        description: "Run only the release build smoke test"
        type: boolean
        default: false
      e5_only:
        description: "Run only the interruption, data and upgrade tests (E5)"
        type: boolean
        default: false
      e5_mode:
        description: "E5: all, quick-backup or quick-call (a short session, then that step alone)"
        type: string
        default: "all"
  schedule:
    - cron: "17 3 * * 0" # Sundays 03:17 UTC
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  emulator:
    if: ${{ !inputs.release_smoke_only && !inputs.e5_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Android 10, small phone", api: 29, profile: "Nexus 5", font: "1.0" }
          - { name: "Android 12, phone", api: 31, profile: "pixel_6", font: "1.0" }
          - { name: "Android 14, phone, 200% text", api: 34, profile: "pixel_6", font: "2.0" }
          - { name: "Android 16, phone", api: 36, profile: "pixel_7", font: "1.0" }
          - { name: "Android 16, tablet", api: 36, profile: "pixel_tablet", font: "1.0" }
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run device tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell settings put system font_scale ${{ matrix.font }}
            # A larger log buffer, so the accessibility findings (logged early in the run) are still there at the end.
            adb logcat -G 16M
            # One line: the results are reported (each failing test with its message) even when a test fails, then the step fails.
            # The phone's crash log goes into the annotations too, since the job logs can't always be read.
            ./gradlew --no-daemon :app:connectedDebugAndroidTest; s=$?; (echo "adb devices: $(timeout 10 adb devices | tail -n +2 | tr '\n' ' ')"; timeout 30 adb logcat -d | grep -E "ANR in com\.personalfitnesscoach|Process: com\.personalfitnesscoach|SnapshotStateObserver"; timeout 30 adb logcat -d -b crash) > crash.txt 2>/dev/null; if [ "$(grep -cv '^adb devices' crash.txt)" = "0" ] && grep -qE 'emulator-[0-9]+\s+device' crash.txt; then : > crash.txt; fi; timeout 30 adb logcat -d -s PFC-A11Y:I | grep 'PFC-A11Y' | sed 's/^.*PFC-A11Y: //' > a11y.txt; timeout 30 adb logcat -d -s PFC-PERF:I | grep 'PFC-PERF' | sed 's/^.*PFC-PERF: //' > perf.txt; python3 -I tools/ci_summary.py "Device tests (${{ matrix.name }})=app/build/outputs/androidTest-results/connected/**/*.xml" "Crash log (${{ matrix.name }})@=crash.txt" "Accessibility checks (${{ matrix.name }})@~=a11y.txt" "Measured (${{ matrix.name }})@~=perf.txt"; exit $s

      - name: Upload device test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: device-tests-api${{ matrix.api }}-${{ strategy.job-index }}
          path: app/build/reports/androidTests/
          if-no-files-found: ignore
          retention-days: 30

  # The release build as shipped (R8 shrinking and obfuscation on), signed with a throw-away key made in the job: installed, started,
  # taken through onboarding to Today and today's session from outside with UI Automator (tools/release_smoke.py).
  release-smoke:
    if: ${{ !inputs.e5_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    name: Release build (R8), Android 14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build the release APK and sign it with a throw-away key
        run: |
          set -o pipefail
          ./gradlew --no-daemon :app:assembleRelease 2>&1 | tail -n 5
          BT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)
          KS="$RUNNER_TEMP/smoke-only.p12"
          keytool -genkeypair -storetype PKCS12 -keystore "$KS" -storepass smoke-only -alias smoke -dname "CN=Release smoke test only" \
            -keyalg RSA -keysize 2048 -validity 2 > /dev/null
          "${BT}zipalign" -p -f 4 "$(ls app/build/outputs/apk/release/*.apk | head -n 1)" "$RUNNER_TEMP/aligned.apk"
          "${BT}apksigner" sign --ks "$KS" --ks-pass pass:smoke-only --out "$RUNNER_TEMP/smoke.apk" "$RUNNER_TEMP/aligned.apk"
          rm -f "$KS"
          echo "SMOKE_APK=$RUNNER_TEMP/smoke.apk" >> "$GITHUB_ENV"

      - name: Release smoke test
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader -noaudio -no-boot-anim -camera-back none
          script: python3 -I tools/release_smoke.py "$SMOKE_APK"

  # Phase 4 Part 3 (E5): a session logged set by set through every interruption (home, screen off, rotation, a call, low memory,
  # process death, a stop while saving, a reboot), Android backup only when end-to-end encrypted, and an upgrade from the Phase 3
  # build (D-110) with a session left open. Driven from outside with adb; the app's own database is the check that no set is lost
  # (tools/device_e5.py). Android 10 uses the older backup rules, Android 14 and 16 the newer ones (16 is the PO's phone).
  e5:
    if: ${{ !inputs.release_smoke_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Android 16", api: 36, profile: "pixel_7" }
          - { name: "Android 14", api: 34, profile: "pixel_6" }
          - { name: "Android 10", api: 29, profile: "Nexus 5" }
    name: Interruptions and data (E5), ${{ matrix.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Build this version and the Phase 3 build to upgrade from
        run: |
          set -o pipefail
          ./gradlew --no-daemon :app:assembleDebug 2>&1 | tail -n 5
          echo "NEW_APK=$(ls "$PWD"/app/build/outputs/apk/debug/*.apk | head -n 1)" >> "$GITHUB_ENV"
          # 35c7862: Phase 3 approved (D-110), the first build the Product Owner could install. Same runner, same debug key.
          git worktree add "$RUNNER_TEMP/old" 35c7862
          (cd "$RUNNER_TEMP/old" && ./gradlew --no-daemon :app:assembleDebug 2>&1 | tail -n 5)
          echo "OLD_APK=$(ls "$RUNNER_TEMP"/old/app/build/outputs/apk/debug/*.apk | head -n 1)" >> "$GITHUB_ENV"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Interruptions, backup and upgrade
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader -noaudio -no-boot-anim -camera-back none
          script: if [ "${{ inputs.e5_mode || 'all' }}" != "all" ]; then python3 -I tools/device_e5.py "${{ inputs.e5_mode }}" "$NEW_APK"; else python3 -I tools/device_e5.py all "$NEW_APK" "$OLD_APK" "$RUNNER_TEMP/old"; fi
